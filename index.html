<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paccy Education Hub | Courses and Notes</title>
<style>
:root{--bg:#f3f6f4;--surface:#fff;--ink:#14301f;--muted:#5a6b60;--line:#d5ded8;--accent:#1f6f4a}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a14;--surface:#16251c;--ink:#e8f1ea;--muted:#9bb0a2;--line:#2a3d31}}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--ink);line-height:1.65}
header,nav,main,footer{max-width:1000px;margin:0 auto;padding-left:1.25rem;padding-right:1.25rem}
header{padding-top:2.5rem}
h1{font-size:clamp(2rem,5vw,3rem);margin:0 0 .4rem;line-height:1.1}
header p{margin:0 0 1.2rem;color:var(--muted)}
nav{display:flex;flex-wrap:wrap;gap:.5rem;font-family:system-ui,sans-serif;padding-bottom:1rem}
button{font:inherit;font-family:system-ui,sans-serif;cursor:pointer;color:var(--ink)}
nav button{border:1px solid var(--line);background:var(--surface);padding:.5rem .9rem;border-radius:999px;font-size:.9rem}
nav button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h2{margin:1.5rem 0 .6rem;font-size:1.4rem;border-left:6px solid var(--accent);padding-left:.75rem}
ul.courses{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.6rem}
ul.courses li{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.7rem 1rem}
.notes{display:grid;grid-template-columns:240px 1fr;gap:1rem;margin-top:.5rem}
.toc{display:flex;flex-direction:column;gap:.3rem}
.toc button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:.45rem .7rem;font-size:.9rem}
.toc button[aria-current=true]{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent);font-weight:700}
.page{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1.5rem;min-height:280px;display:flex;flex-direction:column}
.page small{font-family:system-ui,sans-serif;color:var(--muted)}
.page h3{margin:.3rem 0 .8rem;font-size:1.4rem}
.page p{margin:0 0 1rem;max-width:62ch}
.pager{margin-top:auto;display:flex;justify-content:space-between;gap:.5rem}
.pager button{background:var(--ink);color:var(--bg);border:0;border-radius:6px;padding:.5rem 1rem}
.pager button:disabled{opacity:.35;cursor:default}
@media(max-width:700px){.notes{grid-template-columns:1fr}.toc{flex-direction:row;flex-wrap:wrap}}
@media print{nav,.toc,.pager{display:none}.notes{display:block}}
footer{color:var(--muted);font-family:system-ui,sans-serif;font-size:.85rem;padding-top:1.5rem;padding-bottom:3rem;border-top:1px solid var(--line);margin-top:2rem}
</style>
</head>
<body>
<header><h1>Paccy Education Hub</h1><p>20 courses in four study areas, with 10 pages of study notes for each area.</p></header>
<nav id="tabs" aria-label="Categories"></nav>
<main id="view"></main>
<footer>These notes are short introductions. Always follow your institution&rsquo;s syllabus and local regulations.</footer>

<script>
const cats = [
{id:"edu",name:"Education",color:"#1f6f4a",courses:["Early Childhood Education","Primary Education","Secondary Education","Special Needs Education","Educational Psychology"],notes:[
["What the field covers","Education courses prepare you to teach and support learners from nursery to secondary school. You study how people learn, how to plan and deliver lessons, how to assess progress, and how to care for learners with different needs."],
["Child development","Children grow in stages: physical, language, social, emotional and thinking skills all develop together. Piaget described stages of thinking, while Erikson focused on social and emotional growth. Knowing the stage helps you set realistic goals."],
["Learning theories","Behaviourism links learning to reward and repetition. Constructivism says learners build knowledge from experience. Vygotsky added that guided help from a more skilled person, within reach of the learner, speeds progress."],
["Lesson planning","A good plan states clear objectives, the materials needed, a timed sequence of activities, and how you will check understanding. Start with what learners should be able to do by the end, then work backwards."],
["Classroom management","Set simple rules early, praise the behaviour you want, and keep routines predictable. Prevent problems by keeping learners busy with meaningful tasks. Address misbehaviour calmly and privately."],
["Assessment","Formative assessment (questions, quizzes, observation) guides teaching during a unit. Summative assessment (exams, final projects) measures results at the end. Give feedback that tells learners what to do next."],
["Inclusive and special needs education","Inclusion means every learner takes part, including those with disabilities or learning difficulties. Use varied methods, adapt materials, set individual goals, and work with parents and specialists."],
["Teaching resources and technology","Charts, real objects, stories, songs and local materials make ideas concrete. Digital tools such as projectors, tablets and educational apps help when they serve the lesson goal rather than replace it."],
["Working with families and community","Learners do better when school and home work together. Share progress regularly, listen to parents, and use community knowledge and members as learning resources."],
["Ethics and careers","Teachers must be fair, protect learners, and keep information confidential. Careers include teaching, school leadership, counselling, curriculum design, and educational research or policy work."]]},
{id:"con",name:"Building Construction",color:"#b5651d",courses:["Civil Engineering","Building Technology","Architecture","Quantity Surveying","Plumbing and Pipe Fitting"],notes:[
["What the field covers","Construction courses train you to design, build and manage structures such as houses, roads, bridges and water systems. They combine drawing, mathematics, materials science and practical site skills."],
["Site safety","Wear a helmet, boots, gloves and eye protection. Keep walkways clear, secure scaffolding, and guard open edges and trenches. Report hazards immediately. A safe site is also a more productive site."],
["Reading drawings","Plans show a building from above, elevations show the sides, and sections show a slice through it. Drawings use a scale, such as 1:100, so lengths can be measured accurately. Always check the notes and symbols legend."],
["Building materials","Cement, sand and aggregate make concrete. Steel bars give it tensile strength. Bricks, blocks, timber and roofing sheets each have different cost, strength and durability. Good choice depends on load, climate and budget."],
["Foundations and structure","Foundations spread the building load safely into the ground. Columns and beams carry loads down to the foundation, and slabs form floors. Soil type decides the foundation design."],
["Measurement and costing","Quantity surveyors measure the work from drawings and list it in a Bill of Quantities. Each item is priced by quantity, rate and labour. Accurate quantities prevent budget overruns and disputes."],
["Plumbing and pipe fitting","Plumbers install supply pipes, drains, taps and fixtures. Common pipe materials are PVC, PPR and copper. Drains need a steady slope so waste flows by gravity, and joints must be tested for leaks."],
["Building codes and permits","Codes set minimum standards for safety, fire protection, ventilation and accessibility. A permit is usually required before building. Inspectors check that the work follows approved drawings."],
["Surveying and setting out","Surveyors measure land using tapes, levels and total stations. Setting out transfers the plan onto the ground with pegs and string lines, so the building is placed at the correct position and level."],
["Careers","Graduates work as site supervisors, civil or building technicians, architects, quantity surveyors, plumbers, estimators and contractors. Many start their own construction or consultancy businesses."]]},
{id:"mm",name:"Multimedia",color:"#6a3fa0",courses:["Graphic Design","Video Production and Editing","Photography and Videography","Animation and Cartoon Production","Web Design and Development"],notes:[
["What the field covers","Multimedia combines images, sound, video, animation and interactive content to communicate ideas. Skills include design, storytelling, camera work, editing and coding."],
["Design principles","Strong designs use contrast, alignment, repetition, proximity and hierarchy. Hierarchy tells the viewer what to read first. White space is not wasted space: it gives the content room to breathe."],
["Colour and typography","Colours carry mood, and a palette of three to five colours keeps work consistent. Choose readable fonts, limit yourself to two families, and make sure text has enough contrast against its background."],
["Camera basics","Exposure depends on aperture, shutter speed and ISO. A wide aperture lets in more light and blurs the background. A fast shutter freezes motion. A high ISO brightens the image but adds noise."],
["Light and composition","Soft light flatters faces, and harsh midday light creates strong shadows. Use the rule of thirds, leading lines and framing to guide the eye. Always check the background before pressing record."],
["Video editing workflow","Import and organise footage, assemble a rough cut, trim for pacing, add transitions and titles, fix colour and sound, then export. Clean audio matters more than most beginners expect."],
["Animation principles","Classic principles include squash and stretch, anticipation, timing, follow-through and exaggeration. They make movement feel believable, whether you animate with drawings, 3D models or cut-out characters."],
["Web design basics","HTML gives a page its structure, CSS controls its appearance, and JavaScript adds behaviour. Design for phones first, keep navigation simple, and make pages load quickly and work for all users."],
["File formats and export","JPEG suits photos, PNG suits graphics with transparency, and SVG scales without losing quality. MP4 is the most common video format. Choose settings for the screen, print or platform you are targeting."],
["Portfolio and careers","A portfolio of your best five to ten projects matters more than a certificate. Careers include graphic designer, video editor, photographer, animator, web developer and freelance content creator."]]},
{id:"man",name:"Manufacturing",color:"#1c5f8a",courses:["Mechanical Manufacturing Technology","Welding and Metal Fabrication","Electrical and Electronics Manufacturing","Food Processing Technology","Wood Technology and Furniture Making"],notes:[
["What the field covers","Manufacturing turns raw materials into finished products. Courses cover machines, metals, electrical systems, food production and woodwork, with a strong focus on workshop practice and quality."],
["Workshop safety","Wear the right protective equipment, keep long hair and loose clothing away from machines, and know where the emergency stop and first aid kit are. Never use a machine you have not been trained on."],
["Measurement and tolerances","Rulers, vernier calipers and micrometers measure parts. A tolerance is the allowed variation from the target size. Parts must be made within tolerance so they fit and work together."],
["Machining basics","Lathes rotate the workpiece against a cutting tool, and milling machines rotate the tool against the workpiece. Drilling, cutting and grinding also shape metal. Correct speed, feed and coolant protect the tool and the finish."],
["Welding processes","Arc welding (MMA) is versatile and low cost. MIG welding is fast and good for thicker steel. TIG welding gives clean, precise joints on thin metal. Preparation of the joint decides the quality of the weld."],
["Materials and properties","Steel is strong and hard, aluminium is light and resists corrosion, and copper conducts well. Properties such as hardness, ductility and strength decide which material suits each job."],
["Electrical basics","Ohm&rsquo;s law states that voltage equals current times resistance (V = I &times; R). Circuits need a source, a load and a path. Always isolate power and test that a circuit is dead before working on it."],
["Food safety and processing","Processing methods include drying, canning, fermenting, pasteurising and freezing. HACCP identifies points where contamination could occur and sets controls. Hygiene, correct temperature and clean equipment are essential."],
["Woodwork and furniture","Seasoned timber moves less than wet timber. Common joints include butt, mortise and tenon, dovetail and dowel. Cut along the waste side of the line, sand with progressively finer grit, then seal or finish."],
["Quality and maintenance","Inspect products against specifications and record defects. Regular lubrication, cleaning and checks stop breakdowns. Careers include machinist, welder, technician, food technologist, production supervisor and carpenter."]]}
];
const tabs=document.getElementById("tabs"),view=document.getElementById("view");
let c=0,p=0;
function go(ci,pi){c=ci;p=pi;render()}
function render(){
  const cat=cats[c],n=cat.notes[p];
  tabs.innerHTML="";
  cats.forEach((x,i)=>{const b=document.createElement("button");b.textContent=x.name;b.setAttribute("aria-pressed",i===c);b.onclick=()=>go(i,0);tabs.appendChild(b)});
  document.documentElement.style.setProperty("--accent",cat.color);
  view.innerHTML=`<h2>${cat.name} courses</h2><ul class="courses">${cat.courses.map(x=>`<li>${x}</li>`).join("")}</ul>
  <h2>Study notes</h2><div class="notes"><div class="toc" role="list">${cat.notes.map((x,i)=>`<button ${i===p?'aria-current="true"':''} onclick="go(${c},${i})">${i+1}. ${x[0]}</button>`).join("")}</div>
  <article class="page"><small>Page ${p+1} of ${cat.notes.length}</small><h3>${n[0]}</h3><p>${n[1]}</p>
  <div class="pager"><button ${p===0?"disabled":""} onclick="go(${c},${p-1})">Previous</button><button ${p===cat.notes.length-1?"disabled":""} onclick="go(${c},${p+1})">Next</button></div></article></div>`;
}
render();
</script>
</body>
</html>
